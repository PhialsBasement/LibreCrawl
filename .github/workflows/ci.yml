name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  LIBRECRAWL_URL: http://localhost:5000/
  STARTUP_TIMEOUT_SECONDS: 900

jobs:
  tests:
    name: Fixture tests (Linux, Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Same Python version as the Docker image
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run fixture tests
        run: python tests/fixture_tests.py

  start-script-linux-python:
    name: start-librecrawl.sh (Ubuntu, system Python, no Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Hide Docker so the script takes its Python path
      - name: Hide Docker
        run: |
          while docker_path=$(command -v docker); do
            echo "Hiding $docker_path"
            sudo mv "$docker_path" "$docker_path.hidden"
          done

      # Ubuntu's system Python refuses global pip installs, like a desktop install
      - name: Show the Python the script will use
        run: |
          which python3
          python3 --version
          python3 -c "import sysconfig, os; marker = os.path.join(sysconfig.get_path('stdlib'), 'EXTERNALLY-MANAGED'); print('EXTERNALLY-MANAGED present:', os.path.exists(marker))"

      - name: Run start-librecrawl.sh and wait for the server
        run: .github/scripts/wait-for-start-script.sh ./start-librecrawl.sh

      - name: Show the script output
        if: always()
        run: cat start.log

  start-script-macos:
    name: start-librecrawl.sh (macOS, Apple Silicon, Homebrew Python)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # macOS runners have no Docker, so the script takes its Python path
      - name: Check Docker is absent
        run: |
          if command -v docker; then
            echo "Docker is installed, so the script would not test the Python path"
            exit 1
          fi

      # Homebrew Python is what most Mac users have
      - name: Use Homebrew Python
        run: |
          brew install python
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Run start-librecrawl.sh and wait for the server
        run: .github/scripts/wait-for-start-script.sh ./start-librecrawl.sh

      - name: Show the script output
        if: always()
        run: cat start.log

  start-script-macos-python-org:
    name: start-librecrawl.sh (macOS, Apple Silicon, python.org installer)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PYTHON_ORG_VERSION: 3.15.2
    steps:
      - uses: actions/checkout@v4

      # The installer a beginner downloads from python.org
      - name: Install Python from python.org
        run: |
          curl -fsSL -o python.pkg "https://www.python.org/ftp/python/$PYTHON_ORG_VERSION/python-$PYTHON_ORG_VERSION-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          # The installer puts this first on PATH in the user's shell profile
          echo "/Library/Frameworks/Python.framework/Versions/${PYTHON_ORG_VERSION%.*}/bin" >> "$GITHUB_PATH"

      - name: Check the script will use the python.org Python
        run: |
          which python3
          python3 --version
          case "$(which python3)" in
            /Library/Frameworks/Python.framework/*) ;;
            *) echo "python3 is not the python.org install"; exit 1 ;;
          esac

      - name: Run start-librecrawl.sh and wait for the server
        run: .github/scripts/wait-for-start-script.sh ./start-librecrawl.sh

      - name: Show the script output
        if: always()
        run: cat start.log

  start-script-windows:
    name: start-librecrawl.bat (Windows, Python, no Docker)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # A python.org install: python and the py launcher on PATH
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run start-librecrawl.bat and wait for the server
        shell: pwsh
        run: |
          # Hide Docker so the script takes its Python path
          while ($docker = Get-Command docker -ErrorAction SilentlyContinue) {
            Write-Host "Hiding $($docker.Source)"
            Rename-Item $docker.Source "$($docker.Source).hidden"
          }

          $script = Start-Process cmd.exe -ArgumentList '/c', 'start-librecrawl.bat > start.log 2>&1' -PassThru -NoNewWindow
          $deadline = (Get-Date).AddSeconds([int]$env:STARTUP_TIMEOUT_SECONDS)
          while ((Get-Date) -lt $deadline) {
            try {
              $response = Invoke-WebRequest $env:LIBRECRAWL_URL -MaximumRedirection 0 -SkipHttpErrorCheck -TimeoutSec 5
              if ($response.StatusCode -in 200, 302) {
                Write-Host "LibreCrawl answered with HTTP $($response.StatusCode)"
                exit 0
              }
            } catch { }
            if ($script.HasExited) { throw 'start-librecrawl.bat exited before the server came up' }
            Start-Sleep -Seconds 5
          }
          throw "LibreCrawl did not answer within $env:STARTUP_TIMEOUT_SECONDS s"

      - name: Show the script output
        if: always()
        shell: pwsh
        run: Get-Content start.log
